<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src *; img-src 'self' data:;">
    <title>Homework</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">

        <header class="app-header">
            <div class="header-top">
                <h1>Homework</h1>
                <span id="todayDate" class="today-date"></span>
            </div>
            <div class="stats-bar">
                <div class="stat">
                    <span id="statTotal" class="stat-number">0</span>
                    <span class="stat-label">Total</span>
                </div>
                <div class="stat">
                    <span id="statActive" class="stat-number">0</span>
                    <span class="stat-label">Active</span>
                </div>
                <div class="stat">
                    <span id="statDone" class="stat-number">0</span>
                    <span class="stat-label">Done</span>
                </div>
                <div class="stat">
                    <span id="statOverdue" class="stat-number">0</span>
                    <span class="stat-label">Overdue</span>
                </div>
            </div>
        </header>

        <main class="app-main">

            <section class="filters">
                <div class="filter-row" id="statusFilters">
                    <button class="filter-btn active" data-status="all">All</button>
                    <button class="filter-btn" data-status="active">Active</button>
                    <button class="filter-btn" data-status="completed">Completed</button>
                    <button class="filter-btn" data-status="overdue">Overdue</button>
                </div>
                <div class="filter-row secondary">
                    <select id="categoryFilter">
                        <option value="all">All categories</option>
                        <option value="Study">Study</option>
                        <option value="Work">Work</option>
                        <option value="Personal">Personal</option>
                        <option value="Chores">Chores</option>
                        <option value="Other">Other</option>
                    </select>
                    <select id="sortSelect">
                        <option value="dueDate">Sort: Due date</option>
                        <option value="priority">Sort: Priority</option>
                        <option value="created">Sort: Newest</option>
                        <option value="alpha">Sort: A-Z</option>
                    </select>
                </div>
            </section>

            <section class="task-list-section">
                <ul id="taskList" class="task-list"></ul>
                <div id="emptyState" class="empty-state hidden">
                    <p>Nothing here yet.</p>
                    <span>Tap the + button to add a task.</span>
                </div>
            </section>

        </main>

        <button id="fabAdd" class="fab" aria-label="Add task">+</button>

        <div id="taskModal" class="modal hidden">
            <div class="modal-backdrop"></div>
            <div class="modal-sheet">
                <div class="modal-header">
                    <h2 id="modalTitle">New Task</h2>
                    <button id="modalClose" class="icon-btn" aria-label="Close">&times;</button>
                </div>
                <form id="taskForm">
                    <input type="hidden" id="taskId">

                    <label for="taskTitle">Title</label>
                    <input type="text" id="taskTitle" placeholder="e.g. Finish math homework" required maxlength="120">

                    <label for="taskNotes">Notes</label>
                    <textarea id="taskNotes" placeholder="Optional details..." maxlength="500" rows="3"></textarea>

                    <div class="form-row">
                        <div class="form-col">
                            <label for="taskCategory">Category</label>
                            <select id="taskCategory">
                                <option value="Study">Study</option>
                                <option value="Work">Work</option>
                                <option value="Personal">Personal</option>
                                <option value="Chores">Chores</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-col">
                            <label for="taskPriority">Priority</label>
                            <select id="taskPriority">
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-col">
                            <label for="taskDueDate">Due date</label>
                            <input type="date" id="taskDueDate">
                        </div>
                        <div class="form-col">
                            <label for="taskDueTime">Due time</label>
                            <input type="time" id="taskDueTime">
                        </div>
                    </div>

                    <div class="modal-actions">
                        <button type="button" id="deleteTaskBtn" class="btn btn-danger hidden">Delete</button>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script src="cordova.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
