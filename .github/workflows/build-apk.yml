name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install project dependencies
        run: npm install

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Add Android platform
        run: npx cordova platform add android

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Android APK (release)
        run: npx cordova build android --release -- --packageType=apk

      - name: Locate generated APK
        id: locate_apk
        run: |
          APK_PATH=$(find platforms/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "APK found at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: homework-apk
          path: platforms/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
